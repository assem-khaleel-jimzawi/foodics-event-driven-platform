global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: orders
    metrics_path: /metrics
    static_configs:
      - targets: ["orders:8080"]
        labels:
          service: foodflow-orders

  - job_name: catalog
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8080"]
        labels:
          service: foodflow-catalog

  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory:8080"]
        labels:
          service: foodflow-inventory

  - job_name: payments
    metrics_path: /metrics
    static_configs:
      - targets: ["payments:8080"]
        labels:
          service: foodflow-payments

  - job_name: notifications
    metrics_path: /metrics
    static_configs:
      - targets: ["notifications:8080"]
        labels:
          service: foodflow-notifications

  - job_name: analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics:8080"]
        labels:
          service: foodflow-analytics
