name: foodflow

x-app-build: &app-build
  context: .
  dockerfile: deploy/Dockerfile

services:
  orders-db:
    image: postgres:16.15-alpine
    container_name: foodflow-orders-db
    environment:
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodflow
    restart: unless-stopped

  catalog-db:
    image: postgres:16.15-alpine
    container_name: foodflow-catalog-db
    environment:
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
      POSTGRES_DB: catalog
    ports:
      - "5434:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodflow
    restart: unless-stopped

  inventory-db:
    image: postgres:16.15-alpine
    container_name: foodflow-inventory-db
    environment:
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
      POSTGRES_DB: inventory
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodflow
    restart: unless-stopped

  payments-db:
    image: postgres:16.15-alpine
    container_name: foodflow-payments-db
    environment:
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
      POSTGRES_DB: payments
    ports:
      - "5436:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodflow
    restart: unless-stopped

  notifications-db:
    image: postgres:16.15-alpine
    container_name: foodflow-notifications-db
    environment:
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
      POSTGRES_DB: notifications
    ports:
      - "5437:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodflow
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: foodflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: foodflow
      RABBITMQ_DEFAULT_PASS: foodflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - foodflow
    restart: unless-stopped

  kafka:
    image: bitnamilegacy/kafka:3.9
    container_name: foodflow-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: CLIENT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: CLIENT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

  orders:
    build:
      <<: *app-build
      args:
        PROJECT: src/Services/Orders/FoodFlow.Orders.Api/FoodFlow.Orders.Api.csproj
        DLL: FoodFlow.Orders.Api.dll
    container_name: foodflow-orders
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__OrdersDb: Host=orders-db;Port=5432;Database=orders;Username=foodflow;Password=foodflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: foodflow
      RabbitMq__Password: foodflow
      Kafka__BootstrapServers: kafka:9094
    ports:
      - "5101:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

  catalog:
    build:
      <<: *app-build
      args:
        PROJECT: src/Services/Catalog/FoodFlow.Catalog.Api/FoodFlow.Catalog.Api.csproj
        DLL: FoodFlow.Catalog.Api.dll
    container_name: foodflow-catalog
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__CatalogDb: Host=catalog-db;Port=5432;Database=catalog;Username=foodflow;Password=foodflow
    ports:
      - "5102:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

  inventory:
    build:
      <<: *app-build
      args:
        PROJECT: src/Services/Inventory/FoodFlow.Inventory.Api/FoodFlow.Inventory.Api.csproj
        DLL: FoodFlow.Inventory.Api.dll
    container_name: foodflow-inventory
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__InventoryDb: Host=inventory-db;Port=5432;Database=inventory;Username=foodflow;Password=foodflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: foodflow
      RabbitMq__Password: foodflow
      Kafka__BootstrapServers: kafka:9094
    ports:
      - "5103:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

  payments:
    build:
      <<: *app-build
      args:
        PROJECT: src/Services/Payments/FoodFlow.Payments.Api/FoodFlow.Payments.Api.csproj
        DLL: FoodFlow.Payments.Api.dll
    container_name: foodflow-payments
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__PaymentsDb: Host=payments-db;Port=5432;Database=payments;Username=foodflow;Password=foodflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: foodflow
      RabbitMq__Password: foodflow
      Kafka__BootstrapServers: kafka:9094
    ports:
      - "5104:8080"
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

  notifications:
    build:
      <<: *app-build
      args:
        PROJECT: src/Services/Notifications/FoodFlow.Notifications.Worker/FoodFlow.Notifications.Worker.csproj
        DLL: FoodFlow.Notifications.Worker.dll
    container_name: foodflow-notifications
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__NotificationsDb: Host=notifications-db;Port=5432;Database=notifications;Username=foodflow;Password=foodflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: foodflow
      RabbitMq__Password: foodflow
      Kafka__BootstrapServers: kafka:9094
    ports:
      - "5105:8080"
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

  analytics:
    build:
      <<: *app-build
      args:
        PROJECT: src/Workers/Analytics/FoodFlow.Analytics.Worker/FoodFlow.Analytics.Worker.csproj
        DLL: FoodFlow.Analytics.Worker.dll
    container_name: foodflow-analytics
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:9094
      Kafka__OrdersTopic: foodflow.orders
      Kafka__PaymentsTopic: foodflow.payments
      Kafka__AnalyticsGroupId: foodflow-analytics
    ports:
      - "5106:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - foodflow
    restart: unless-stopped

volumes:
  orders-db-data:
  catalog-db-data:
  inventory-db-data:
  payments-db-data:
  notifications-db-data:
  rabbitmq-data:
  kafka-data:

networks:
  foodflow:
    name: foodflow
    driver: bridge
